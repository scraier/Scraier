<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTHER — Intelligence Council</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap');

:root {
  --bg: #050507;
  --surface: rgba(12,14,18,0.85);
  --surface2: rgba(18,20,26,0.9);
  --surface3: rgba(24,26,34,0.95);
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --border3: rgba(255,255,255,0.15);
  --red: #e03020;
  --red2: #ff4433;
  --red-glow: rgba(224,48,32,0.4);
  --red-dim: rgba(224,48,32,0.1);
  --white: #f0f2f5;
  --white2: #c8d0d8;
  --dim: #5a6878;
  --dimmer: #2a3440;
  --claude: #38bdf8;
  --gpt: #34d399;
  --grok: #f1f5f9;
  --deepseek: #a78bfa;
  --gemini: #4285f4;
  --gold: #f59e0b;
  --gold-dim: rgba(245,158,11,0.1);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated neural network canvas */
#neural-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.7;
}

/* Glass overlay for readability */
.glass-overlay {
  position: fixed;
  inset: 0;
  background: radial-gradient(ellipse at center bottom, rgba(5,5,7,0.3) 0%, rgba(5,5,7,0.7) 100%);
  z-index: 1;
  pointer-events: none;
}

.app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 32px;
  background: rgba(5,5,7,0.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-brand {
  display: flex;
  align-items: baseline;
  gap: 16px;
}

.mother-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 8px;
  color: var(--white);
  text-shadow: 0 0 30px rgba(224,48,32,0.5), 0 0 60px rgba(224,48,32,0.2);
}

.header-tagline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--dim);
  text-transform: uppercase;
}

.header-models {
  display: flex;
  gap: 20px;
  align-items: center;
}

.model-pip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--dim);
}

.pip {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  animation: pipAnim 3s ease-in-out infinite;
}

.pip.claude { background: var(--claude); box-shadow: 0 0 8px var(--claude); }
.pip.gpt { background: var(--gpt); box-shadow: 0 0 8px var(--gpt); animation-delay: 0.5s; }
.pip.grok { background: var(--grok); box-shadow: 0 0 8px var(--grok); animation-delay: 1s; }
.pip.deepseek { background: var(--deepseek); box-shadow: 0 0 8px var(--deepseek); animation-delay: 1.5s; }

@keyframes pipAnim {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.4; transform:scale(0.8); }
}

/* ── MAIN CONTENT ── */
.main {
  flex: 1;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 40px;
  max-width: 1400px;
  margin: 0 auto;
  width: 100%;
}

/* ── EMPTY STATE ── */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 80px 40px;
  gap: 24px;
}

.empty-glyph {
  font-family: 'Orbitron', sans-serif;
  font-size: 80px;
  font-weight: 900;
  letter-spacing: 20px;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,0.08);
  text-shadow: none;
  user-select: none;
}

.empty-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 6px;
  color: rgba(255,255,255,0.2);
  text-transform: uppercase;
}

.empty-desc {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--dimmer);
  line-height: 2.2;
  text-transform: uppercase;
}

/* ── EXCHANGE ── */
.exchange {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.query-bubble {
  align-self: flex-end;
  max-width: 70%;
  background: rgba(224,48,32,0.08);
  border: 1px solid rgba(224,48,32,0.25);
  border-radius: 16px 16px 4px 16px;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 500;
  color: var(--white);
  line-height: 1.6;
  backdrop-filter: blur(10px);
}

.query-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--red);
  margin-bottom: 6px;
  text-transform: uppercase;
}

/* ── ROUND ── */
.round-block {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.round-label {
  display: flex;
  align-items: center;
  gap: 12px;
}

.round-pill {
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--red2);
  background: var(--red-dim);
  border: 1px solid rgba(224,48,32,0.3);
  padding: 4px 12px;
  border-radius: 20px;
}

.round-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(224,48,32,0.3), transparent);
}

/* ── MODEL GRID ── */
.models-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

@media (max-width: 800px) { .models-grid { grid-template-columns: 1fr; } }

.model-card {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.3s;
  animation: cardReveal 0.4s ease forwards;
  opacity: 0;
  transform: translateY(12px);
}

@keyframes cardReveal {
  to { opacity:1; transform:translateY(0); }
}

.model-card.claude-card { border-color: rgba(56,189,248,0.2); }
.model-card.gpt-card { border-color: rgba(52,211,153,0.2); }
.model-card.grok-card { border-color: rgba(241,245,249,0.1); }
.model-card.deepseek-card { border-color: rgba(167,139,250,0.2); }

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}

.model-name-tag {
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
}

.claude-tag { color: var(--claude); }
.gpt-tag { color: var(--gpt); }
.grok-tag { color: var(--grok); }
.deepseek-tag { color: var(--deepseek); }

.model-role-small {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--dim);
  letter-spacing: 2px;
  margin-left: auto;
  text-transform: uppercase;
}

/* Thinking toggle */
.thinking-row {
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.2);
}

.think-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
  transition: color 0.2s;
  padding: 0;
}

.think-btn:hover { color: var(--gold); }

.think-chevron {
  width: 12px;
  height: 12px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);
  transition: transform 0.2s;
  margin-top: -2px;
}

.think-btn.open .think-chevron { transform: rotate(45deg); margin-top: 2px; }

.thinking-body {
  display: none;
  margin-top: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--dim);
  line-height: 1.7;
  border-left: 2px solid var(--border2);
  padding-left: 12px;
  white-space: pre-wrap;
}

.thinking-body.open { display: block; }

.card-body {
  padding: 16px;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.75;
  color: var(--white2);
}

/* Loading bars */
.loading-bars {
  padding: 20px 16px;
  display: flex;
  gap: 4px;
  align-items: flex-end;
  height: 60px;
}

.bar {
  width: 4px;
  border-radius: 2px;
  background: var(--border2);
  animation: barAnim 1.4s ease-in-out infinite;
}

.bar:nth-child(1) { height: 40%; animation-delay: 0s; }
.bar:nth-child(2) { height: 70%; animation-delay: 0.1s; }
.bar:nth-child(3) { height: 50%; animation-delay: 0.2s; }
.bar:nth-child(4) { height: 90%; animation-delay: 0.3s; }
.bar:nth-child(5) { height: 60%; animation-delay: 0.4s; }
.bar:nth-child(6) { height: 80%; animation-delay: 0.5s; }
.bar:nth-child(7) { height: 45%; animation-delay: 0.6s; }

@keyframes barAnim {
  0%,100% { background: var(--border2); transform: scaleY(1); }
  50% { background: var(--red2); transform: scaleY(1.4); }
}

/* ── CONSENSUS ── */
.consensus-block {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
}

.consensus-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.consensus-heading {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--gold);
  text-transform: uppercase;
}

.consensus-num {
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  font-weight: 900;
}

.consensus-bar {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 18px;
}

.consensus-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
}

.positions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.position {
  padding: 12px 14px;
  border-radius: 8px;
}

.position.majority {
  background: rgba(52,211,153,0.05);
  border: 1px solid rgba(52,211,153,0.2);
}

.position.minority {
  background: rgba(245,158,11,0.05);
  border: 1px solid rgba(245,158,11,0.15);
}

.pos-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.position.majority .pos-label { color: var(--gpt); }
.position.minority .pos-label { color: var(--gold); }

.pos-models {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--dim);
  margin-bottom: 6px;
}

.pos-text {
  font-size: 12px;
  line-height: 1.6;
  color: var(--white2);
}

/* ── VERDICT ── */
.verdict-block {
  background: var(--surface);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(245,158,11,0.3);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
}

.verdict-block::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at top left, rgba(245,158,11,0.06) 0%, transparent 60%);
  pointer-events: none;
}

.verdict-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 24px;
  border-bottom: 1px solid rgba(245,158,11,0.15);
  background: rgba(245,158,11,0.04);
}

.verdict-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 12px var(--gold);
  animation: verdictPulse 2s ease-in-out infinite;
}

@keyframes verdictPulse {
  0%,100% { box-shadow: 0 0 12px var(--gold); }
  50% { box-shadow: 0 0 24px var(--gold), 0 0 48px rgba(245,158,11,0.3); }
}

.verdict-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 5px;
  color: var(--gold);
}

.verdict-body {
  padding: 24px;
  font-size: 15px;
  font-weight: 400;
  line-height: 1.8;
  color: var(--white);
}

.directive-box {
  margin-top: 20px;
  padding: 16px 20px;
  background: var(--gold-dim);
  border: 1px solid rgba(245,158,11,0.25);
  border-radius: 10px;
}

.directive-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--gold);
  margin-bottom: 8px;
  text-transform: uppercase;
}

.directive-text {
  font-size: 15px;
  font-weight: 600;
  color: #fcd34d;
  line-height: 1.6;
}

/* ── INPUT AREA ── */
.input-area {
  position: sticky;
  bottom: 0;
  z-index: 50;
  padding: 16px 32px 24px;
  background: linear-gradient(to top, rgba(5,5,7,0.98) 70%, transparent);
}

.input-card {
  background: var(--surface2);
  backdrop-filter: blur(30px);
  border: 1px solid var(--border2);
  border-radius: 16px;
  overflow: hidden;
  max-width: 1340px;
  margin: 0 auto;
  transition: border-color 0.3s;
}

.input-card:focus-within {
  border-color: rgba(224,48,32,0.4);
  box-shadow: 0 0 40px rgba(224,48,32,0.08);
}

.input-top {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
}

.ctrl-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--dim);
  text-transform: uppercase;
  white-space: nowrap;
}

.rounds-group {
  display: flex;
  gap: 4px;
}

.round-chip {
  width: 30px;
  height: 26px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--dim);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.round-chip:hover { border-color: var(--border3); color: var(--white); }

.round-chip.active {
  background: var(--red-dim);
  border-color: var(--red2);
  color: var(--red2);
  font-weight: 700;
  box-shadow: 0 0 10px var(--red-glow);
}

.divider-v {
  width: 1px;
  height: 20px;
  background: var(--border);
}

.mode-picker {
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 4px 10px;
  color: var(--white2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
}

.mode-picker:focus { border-color: var(--border3); }
.mode-picker option { background: #0c0e14; }

.input-middle {
  display: flex;
  align-items: flex-end;
  gap: 0;
}

.prompt-field {
  flex: 1;
  background: transparent;
  border: none;
  padding: 16px 20px;
  color: var(--white);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 400;
  resize: none;
  outline: none;
  line-height: 1.6;
  min-height: 60px;
  max-height: 200px;
}

.prompt-field::placeholder { color: var(--dimmer); }

.send-btn {
  width: 52px;
  height: 52px;
  background: var(--red);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  align-self: flex-end;
  margin: 4px 4px 4px 0;
  border-radius: 12px;
}

.send-btn:hover {
  background: var(--red2);
  box-shadow: 0 0 24px var(--red-glow);
  transform: scale(1.05);
}

.send-btn:disabled {
  background: var(--border2);
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.send-arrow {
  width: 0;
  height: 0;
  border-left: 10px solid var(--white);
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  margin-left: 2px;
}

.send-btn:disabled .send-arrow { border-left-color: var(--dim); }

.input-bottom {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 20px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.qp-chip {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--dim);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  white-space: nowrap;
}

.qp-chip:hover { border-color: var(--red2); color: var(--red2); }

.progress-bar-wrap {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 200px;
}

.progress-track {
  flex: 1;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red), var(--gold));
  border-radius: 1px;
  transition: width 0.5s ease;
  width: 0%;
}

.progress-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--dim);
  white-space: nowrap;
  text-transform: uppercase;
}

.error-msg {
  color: var(--red2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 12px 16px;
}
</style>
</head>
<body>

<!-- Neural network canvas background -->
<canvas id="neural-canvas"></canvas>
<div class="glass-overlay"></div>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-brand">
      <div class="mother-title">MOTHER</div>
      <div class="header-tagline">Intelligence Council · Scraier</div>
    </div>
    <div class="header-models">
      <div class="model-pip"><div class="pip claude"></div>Claude</div>
      <div class="model-pip"><div class="pip gpt"></div>GPT</div>
      <div class="model-pip"><div class="pip grok"></div>Grok</div>
      <div class="model-pip"><div class="pip deepseek"></div>DeepSeek</div>
      <div class="model-pip"><div class="pip gemini"></div>Gemini</div>
    </div>
  </header>

  <!-- MAIN -->
  <div class="main" id="main-content">
    <div class="empty-state" id="empty-state">
      <div class="empty-glyph">M</div>
      <div class="empty-title">Council Standing By</div>
      <div class="empty-desc">
        Submit a query · The council deliberates<br>
        Models debate · Consensus emerges · Mother decides
      </div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-card">
      <div class="input-top">
        <span class="ctrl-label">Rounds</span>
        <div class="rounds-group">
          <button class="round-chip active" onclick="setRounds(1,this)">1</button>
          <button class="round-chip" onclick="setRounds(2,this)">2</button>
          <button class="round-chip" onclick="setRounds(3,this)">3</button>
          <button class="round-chip" onclick="setRounds(4,this)">4</button>
          <button class="round-chip" onclick="setRounds(5,this)">5</button>
        </div>
        <div class="divider-v"></div>
        <span class="ctrl-label">Mode</span>
        <select class="mode-picker" id="mode-picker">
          <option value="general">General</option>
          <option value="trading">Trading</option>
          <option value="business">Business</option>
          <option value="devil">Devil's Advocate</option>
          <option value="philosophy">Philosophy</option>
        </select>
      </div>

      <div class="input-middle">
        <textarea class="prompt-field" id="prompt-field"
          placeholder="Ask the council anything..."
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
          rows="2"></textarea>
        <button class="send-btn" id="send-btn" onclick="summon()">
          <div class="send-arrow"></div>
        </button>
      </div>

const canvas = document.getElementById('neural-canvas');
const ctx = canvas.getContext('2d');
let nodes = [], W, H;

function initCanvas() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  nodes = [];
  const count = Math.floor((W * H) / 18000);
  for (let i = 0; i < count; i++) {
    nodes.push({ x: Math.random()*W, y: Math.random()*H, vx:(Math.random()-0.5)*0.3, vy:(Math.random()-0.5)*0.3, r:Math.random()*2+1, pulse:Math.random()*Math.PI*2 });
  }
}

function drawCanvas() {
  ctx.clearRect(0,0,W,H);
  const grad = ctx.createRadialGradient(W/2,H*0.4,0,W/2,H/2,Math.max(W,H)*0.8);
  grad.addColorStop(0,'rgba(20,10,10,0.95)');
  grad.addColorStop(0.4,'rgba(8,8,12,0.97)');
  grad.addColorStop(1,'rgba(3,3,6,1)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);
  for (let i=0;i<nodes.length;i++) {
    for (let j=i+1;j<nodes.length;j++) {
      const dx=nodes[i].x-nodes[j].x, dy=nodes[i].y-nodes[j].y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if (dist<140) {
        const alpha=(1-dist/140)*0.3;
        const isRed=(i+j)%12===0;
        ctx.strokeStyle=isRed?`rgba(200,40,20,${alpha*0.8})`:`rgba(160,170,190,${alpha*0.25})`;
        ctx.lineWidth=isRed?1.2:0.5;
        ctx.beginPath(); ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke();
      }
    }
  }
  nodes.forEach((n,i)=>{
    n.pulse+=0.02;
    const glow=0.6+0.4*Math.sin(n.pulse);
    const isRed=i%15===0, isBright=i%8===0;
    if(isRed){ctx.fillStyle=`rgba(220,50,30,${glow*0.9})`;ctx.shadowColor='rgba(220,50,30,0.8)';ctx.shadowBlur=10;}
    else if(isBright){ctx.fillStyle=`rgba(220,230,240,${glow*0.7})`;ctx.shadowColor='rgba(200,210,230,0.5)';ctx.shadowBlur=6;}
    else{ctx.fillStyle=`rgba(100,120,150,${glow*0.4})`;ctx.shadowBlur=0;}
    ctx.beginPath();ctx.arc(n.x,n.y,n.r*(isRed?1.5:1),0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    n.x+=n.vx; n.y+=n.vy;
    if(n.x<0||n.x>W)n.vx*=-1; if(n.y<0||n.y>H)n.vy*=-1;
  });
  requestAnimationFrame(drawCanvas);
}

// ── ALGORITHMIC CONSENSUS ENGINE ──
function analyzeConsensus(allRoundHistory, roundNum) {
  const ids = Object.keys(APIS);
  const holdW = ['maintain','stand by','hold','assert','insist','unchanged','i hold','still argue','continue to'];
  const shiftW = ['concede','acknowledge','agree','grant','fair point','modify','reverse','reconsider','update my','changing','shift'];
  const challengeW = ['wrong','incorrect','flawed','fails','ignores','misses','challenge','refute','reject','dispute','misleading'];

  const stability = {}; const drift = {}; const challenged = {}; const convergence = {};
  ids.forEach(id => { stability[id]=0; drift[id]=0; challenged[id]=0; convergence[id]=0; });

  for (let r=1; r<=roundNum; r++) {
    const roundData = allRoundHistory[r] || {};
    ids.forEach(id => {
      const text = (roundData[id]?.response || '').toLowerCase();
      if (!text) return;
      holdW.forEach(w => { if(text.includes(w)) stability[id]++; });
      shiftW.forEach(w => { if(text.includes(w)) drift[id]++; });
      ids.filter(other=>other!==id).forEach(other => {
        const otherName = APIS[other].name.toLowerCase();
        if (text.includes(otherName)) {
          challengeW.forEach(w => { if(text.includes(w)) challenged[other]++; });
        }
      });
      if (r > 1) {
        ids.filter(other=>other!==id).forEach(other => {
          const prevText = (allRoundHistory[r-1]?.[other]?.response || '').toLowerCase();
          if (!prevText) return;
          const keyWords = prevText.match(/\b[a-z]{5,}\b/g) || [];
          const unique = [...new Set(keyWords)].slice(0, 30);
          const matches = unique.filter(w => text.includes(w)).length;
          if (matches >= 4) convergence[other]++;
        });
      }
    });
  }

  const winner = ids.reduce((a,b) => convergence[a]>=convergence[b]?a:b);
  const mostStable = ids.reduce((a,b) => stability[a]>=stability[b]?a:b);
  const mostDrift = ids.reduce((a,b) => drift[a]>=drift[b]?a:b);
  const mostChallenged = ids.reduce((a,b) => challenged[a]>=challenged[b]?a:b);
  const avgDrift = ids.reduce((s,id)=>s+drift[id],0)/ids.length||1;
  const consensusPct = Math.max(10, Math.min(95, Math.round(100-(avgDrift/3)*100)));
  const disputeIntensity = Math.min(95, Math.round(ids.reduce((s,id)=>s+challenged[id],0)/(ids.length*2)*100));

  return {
    consensusPct, disputeIntensity, winner, mostStable, mostDrift, mostChallenged,
    convergence, stability, drift, challenged,
    positionMap: Object.fromEntries(ids.map(id=>[id,(allRoundHistory[roundNum]?.[id]?.response||'').substring(0,120)]))
  };
}

function fillCard(card, raw, isErr) {
  const loadEl = card.querySelector('.loading-bars');
  const thinkEl = card.querySelector('[data-think]');
  if (isErr) { loadEl.outerHTML=`<div class="error-msg">⚠ ${h(raw)}</div>`; return; }
  
  let thinking = '', response = raw;
  
  // Strategy 1: Explicit THINKING:/RESPONSE: markers
  if (raw.includes('THINKING:') && raw.includes('RESPONSE:')) {
    const ti = raw.indexOf('THINKING:');
    const ri = raw.indexOf('RESPONSE:');
    if (ri > ti) {
      thinking = raw.substring(ti + 9, ri).trim();
      response = raw.substring(ri + 9).trim();
    }
  }
  // Strategy 2: Only THINKING: present — split on double newline after thinking section
  else if (raw.includes('THINKING:')) {
    const ti = raw.indexOf('THINKING:');
    const afterThink = raw.substring(ti + 9);
    const splitIdx = afterThink.search(/\n\n/);
    if (splitIdx > -1) {
      thinking = afterThink.substring(0, splitIdx).trim();
      response = afterThink.substring(splitIdx).trim();
    } else {
      thinking = afterThink.trim();
      response = '';
    }
  }
  // Strategy 3: No markers — check if starts with thinking-like content before actual response
  else {
    const lines = raw.split('\n');
    const respLineIdx = lines.findIndex(l => 
      l.match(/^(RESPONSE:|Round \d|##|\*\*[A-Z]|[A-Z]{2,}:|My position|I argue|I challenge)/i)
    );
    if (respLineIdx > 1) {
      thinking = lines.slice(0, respLineIdx).join('\n').trim();
      response = lines.slice(respLineIdx).join('\n').trim();
    }
  }
  
  // Fallback — if response is empty use full raw
  if (!response) response = raw;
  
  // Clean up any leftover THINKING prefix in response
  response = response.replace(/^THINKING:.*?\n\n/s, '').trim();
  
  if (thinkEl) thinkEl.textContent = thinking || 'Reasoning not captured.';
  loadEl.outerHTML = `<div class="card-body">${h(response).replace(/\n/g,'<br>')}</div>`;
}

    </div>`;
  setTimeout(()=>{ const f=el.querySelector('.consensus-fill'); if(f) f.style.width=consensusPct+'%'; },100);
  return el;
}

function makeVerdict(raw, roundNum) {
  const match = raw.match(/MOTHER'S DIRECTIVE:(.*?)(?:\n|$)/s);
  const directive = match?match[1].trim():'';
  const body = raw.replace(/MOTHER'S DIRECTIVE:.*$/s,'').trim();
  const el = document.createElement('div');
  el.className = 'verdict-block';
  el.innerHTML = `
    <div class="verdict-header">
      <div class="verdict-dot"></div>
      <div class="verdict-title">MOTHER\'S VERDICT — After ${roundNum} Rounds</div>
    </div>
    <div class="verdict-body">
      ${h(body).replace(/\n/g,'<br>')}
      ${directive?`<div class="directive-box"><div class="directive-label">Final Directive</div><div class="directive-text">${h(directive)}</div></div>`:''}
    </div>`;
  return el;
}

// ── MAIN ENGINE ──
async function summon() {
  const promptField = document.getElementById('prompt-field');
  const input = promptField.value.trim();
  if (!input || running) return;
  running = true;
  document.getElementById('send-btn').disabled = true;
  promptField.value = ''; promptField.style.height = 'auto';

  const main = document.getElementById('main-content');
  const empty = document.getElementById('empty-state');
  if (empty) empty.remove();

  const mode = document.getElementById('mode-picker').value;
  const modelIds = Object.keys(APIS);
  const isFollowUp = currentDebate !== null;

  let originalQ, followUpQ, startRound, exchange, allRoundHistory, allDebateText;

  if (isFollowUp) {
    originalQ = currentDebate.originalQ;
    followUpQ = input;
    startRound = currentDebate.roundCount + 1;
    exchange = currentDebate.exchangeEl;
    allRoundHistory = currentDebate.allRoundHistory;
    allDebateText = currentDebate.allDebateText;

    const fu = document.createElement('div');
    fu.className = 'query-bubble';
    fu.style.cssText = 'background:rgba(56,189,248,0.06);border-color:rgba(56,189,248,0.2)';
    fu.innerHTML = `<div class="query-label" style="color:var(--claude)">↳ Follow-Up · Rounds ${startRound}+</div>${h(input)}`;
    exchange.appendChild(fu);
  } else {
    originalQ = input;
    followUpQ = null;
    startRound = 1;
    allRoundHistory = {};
    allDebateText = '';

    exchange = document.createElement('div');
    exchange.className = 'exchange';
    const qb = document.createElement('div');
    qb.className = 'query-bubble';
    qb.innerHTML = `<div class="query-label">Debate Topic</div>${h(originalQ)}`;
    exchange.appendChild(qb);
    main.appendChild(exchange);
  }

  exchange.scrollIntoView({behavior:'smooth',block:'start'});
  const endRound = startRound + selectedRounds - 1;

  for (let r=startRound; r<=endRound; r++) {
    setProgress(((r-startRound)/selectedRounds)*85, `Round ${r} of ${endRound} — Deliberating`);

    const rb = document.createElement('div');
    rb.className = 'round-block';
    rb.innerHTML = `<div class="round-label">
      <span class="round-pill">ROUND ${r}</span>
      <div class="round-line"></div>
      ${r>5?'<span class="round-pill" style="background:rgba(245,158,11,0.1);border-color:rgba(245,158,11,0.3);color:#f59e0b">EXTENDED</span>':''}
    </div>`;
    const grid = document.createElement('div');
    grid.className = 'models-grid';
    rb.appendChild(grid);
    exchange.appendChild(rb);

    const cards = {};
    modelIds.forEach(id=>{ const c=makeCard(id,r); grid.appendChild(c); cards[id]=c; });
    window.scrollTo(0,document.body.scrollHeight);

    allRoundHistory[r] = {};
    await Promise.all(modelIds.map(async id=>{
      const msgs = buildMessages(id, mode, r, allRoundHistory, originalQ, followUpQ);
      try {
        const raw = await callAPI(APIS[id], msgs);
        let thinking='',response=raw;
        if(raw.includes('THINKING:')&&raw.includes('RESPONSE:')){
          const ti=raw.indexOf('THINKING:'),ri=raw.indexOf('RESPONSE:');
          thinking=raw.substring(ti+9,ri).trim(); response=raw.substring(ri+9).trim();
        }
        allRoundHistory[r][id]={raw,thinking,response};
        fillCard(cards[id],raw,false);
      } catch(e) {
        allRoundHistory[r][id]={raw:'',thinking:'',response:`[Error: ${e.message}]`};
        fillCard(cards[id],e.message||'Failed',true);
      }
    }));

    allDebateText += `\n\n═══ ROUND ${r} ═══\n`;
    allDebateText += modelIds.map(id=>`${APIS[id].name} (${APIS[id].role}):\n${allRoundHistory[r][id]?.response||'[no response]'}`).join('\n\n');

    exchange.appendChild(makeConsensusBlock(analyzeConsensus(allRoundHistory,r), r));
    window.scrollTo(0,document.body.scrollHeight);
    if(r<endRound) await new Promise(res=>setTimeout(res,200));
  }

  setProgress(90,'MOTHER computing verdict...');

  // Algorithmic verdict — no AI bias, pure text analysis
  const verdictText = buildAlgorithmicVerdict(allRoundHistory, endRound, originalQ);
  exchange.appendChild(makeVerdict(verdictText, endRound));

  const vm = verdictText.match(/MOTHER'S DIRECTIVE:(.*?)(?:\n|$)/s);
  sessionHistory.push({q:originalQ, verdict:vm?vm[1].trim():verdictText.substring(0,200), rounds:endRound});

  currentDebate = {originalQ, exchangeEl:exchange, allRoundHistory, allDebateText, roundCount:endRound};

  const hint = document.createElement('div');
  hint.style.cssText='font-family:JetBrains Mono,monospace;font-size:10px;color:var(--dim);letter-spacing:2px;text-align:center;padding:16px;text-transform:uppercase;border-top:1px solid var(--border);margin-top:8px;';
  hint.textContent = `${endRound} rounds complete — submit a follow-up to push into rounds ${endRound+1}+`;
  exchange.appendChild(hint);

  setProgress(100,'Complete');
  setTimeout(()=>setProgress(0,'',false),2500);
  document.getElementById('prompt-field').placeholder=`Round ${currentDebate?.roundCount||endRound} complete — push deeper with a follow-up...`;
  running=false;
  document.getElementById('send-btn').disabled=false;
  window.scrollTo(0,document.body.scrollHeight);
}

</script>
